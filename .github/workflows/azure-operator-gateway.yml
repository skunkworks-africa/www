name: Deploy Azure Operator Gateway (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    environment: azure-operator-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies
        working-directory: edge/azure-operator-gateway
        run: npm install --no-audit --no-fund
      - name: Azure login via federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy via Azure Functions Action
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_OPERATOR_FUNCTION_APP }}
          package: edge/azure-operator-gateway
