name: Deploy Azure Operator Gateway (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    environment: azure-operator-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check API source syntax
        run: node --check edge/azure-operator-gateway/src/functions/inventory.js
      - name: Check MCP source syntax
        run: node --check edge/azure-operator-gateway/src/functions/mcp.js
      - name: Azure login via federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify target app and required security configuration
        env:
          APP: ${{ vars.AZURE_OPERATOR_FUNCTION_APP }}
        shell: bash
        run: |
          set -euo pipefail
          RG='rg-skunkworks-automation-prod'
          [[ "$APP" == 'func-skunkworks-operator-prod' ]] || { echo 'Unexpected Function App target'; exit 1; }
          APP_ID=$(az functionapp show --name "$APP" --resource-group "$RG" --query id -o tsv)
          [[ "$APP_ID" == "/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RG/providers/Microsoft.Web/sites/$APP" ]] || { echo 'Unexpected Azure resource identifier'; exit 1; }
          az functionapp show --name "$APP" --resource-group "$RG" --query '{name:name,kind:kind,location:location}' -o json
          SETTINGS=$(az functionapp config appsettings list --name "$APP" --resource-group "$RG" --query '[].name' -o tsv)
          for KEY in AZURE_CLIENT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_OPERATOR_API_AUDIENCE AZURE_OPERATOR_ALLOWED_USER_OIDS; do
            grep -Fxq "$KEY" <<< "$SETTINGS" || { echo "Missing required app setting: $KEY"; exit 1; }
          done
          echo 'Required setting names present (values deliberately not printed).'
      - name: Deploy via Azure Functions Action
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_OPERATOR_FUNCTION_APP }}
          package: edge/azure-operator-gateway
          remote-build: true
      - name: Smoke test MCP without an access token
        shell: bash
        run: |
          set -euo pipefail
          HOST=$(az functionapp show --name "${{ vars.AZURE_OPERATOR_FUNCTION_APP }}" --resource-group rg-skunkworks-automation-prod --query defaultHostName -o tsv)
          test -n "$HOST"
          echo "Testing /api/mcp unauthenticated rejection (no tokens logged)"
          RESPONSE=$(curl -sS --max-time 30 -o /tmp/mcp-response.json -w '%{http_code}' -X POST "https://$HOST/api/mcp" -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          test "$RESPONSE" = "401" || { echo "Unexpected status $RESPONSE"; cat /tmp/mcp-response.json; exit 1; }
          echo 'HTTP 401 confirmed; rejecting unauthenticated MCP calls.'
          echo 'MCP unauthenticated rejection passed'
      - name: Verify OAuth protected-resource discovery
        shell: bash
        run: |
          set -euo pipefail
          HOST=$(az functionapp show --name "${{ vars.AZURE_OPERATOR_FUNCTION_APP }}" --resource-group rg-skunkworks-automation-prod --query defaultHostName -o tsv)
          curl --fail --silent --show-error --max-time 30 "https://$HOST/api/.well-known/oauth-protected-resource" -o /tmp/resource.json
          node -e "const m=require('/tmp/resource.json'); if(!m.resource?.endsWith('/api/mcp') || !m.authorization_servers?.length || !m.scopes_supported?.includes('Azure.Read'))process.exit(1)"
          echo 'OAuth protected-resource discovery passed at /api/.well-known/oauth-protected-resource'
