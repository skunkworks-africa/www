name: Test global presence map

on:
  pull_request:
    paths:
      - 'global-presence/**'
      - '.github/workflows/global-presence-map.yml'
  push:
    branches: [main]
    paths:
      - 'global-presence/**'
      - '.github/workflows/global-presence-map.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node global-presence/browser.test.mjs
