name: Reseller workflow policy tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check resellers/app.mjs
      - run: node --test resellers/test.mjs
      - run: node scripts/validate-site.mjs
