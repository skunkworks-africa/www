name: Reseller workflow policy tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check resellers/app.mjs
      - name: Build applicant frontend and validate browser bundle
        run: |
          npm install --prefix scripts/reseller-ui --no-audit --no-fund
          npm run build --prefix scripts/reseller-ui
          node --check resellers/applicant-portal.js
      - run: node --test resellers/test.mjs
      - run: node scripts/validate-site.mjs
      - name: Install Azure Functions dependencies
        run: npm ci --ignore-scripts --prefix edge/azure-operator-gateway
      - name: Test reseller MCP authentication and workflow adapters
        run: npm test --prefix edge/azure-operator-gateway
